name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format tracked source in CI checkout
        run: npx prettier --write .
      - name: Export formatted tracked files for reviewable commit
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          extensions = {".ts", ".tsx", ".js", ".mjs", ".json", ".css", ".md", ".yml", ".yaml", ".html"}
          paths = subprocess.check_output(["git", "ls-files", "-z").split(b"\\0")
          for raw_path in paths:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8")
              if Path(path).suffix.lower() not in extensions:
                  continue
              file_path = Path(path)
              if file_path.is_file():
                  content = file_path.read_text(encoding="utf-8")
                  print("FMTFILE:" + path + ":" + json.dumps(content, ensure_ascii=False, separators=(",", ":")))
          PY
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
