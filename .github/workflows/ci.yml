name: CI

# Run deterministic quality gates against the formatted source tree.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate continuity records
        run: node scripts/check-continuity.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format maintained source and documentation on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          npx prettier --write "*.md" "docs/**/*.md" scripts/check-continuity.mjs
          lib/time/ist-local-date-time.ts tests/question-schema.test.ts
      - name: Commit formatting corrections
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Prettier formatting to maintained files"
          git push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run format:check
      - run: npm run build
